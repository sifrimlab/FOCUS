name: CI

# Verify behavior, strict typing, source style, and installed release contents.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system libraries (OpenCV runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install FOCUS and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # torch/torchvision/timm/huggingface-hub are deliberately kept out of
          # requirements.txt and pyproject.toml (see install.sh). Install the CPU
          # wheels here so the feature_extraction modules import.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm huggingface-hub
          pip install -e '.[dev]'

      - name: Python tests
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest

      - name: Strict types, lint, and formatting
        run: |
          python -m mypy
          python -m ruff check src scripts tests tools typing
          python -m ruff format --check src scripts tests tools typing
          python scripts/check_structure.py

      - name: Build and check release archives
        run: |
          python -m build
          python scripts/check_dist.py dist

      - name: Install wheel
        run: |
          pip uninstall -y focus
          pip install --no-deps dist/*.whl

      - name: Import & CLI smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import focus; print('imported focus OK')"
          python -c "import focus.registration.encoder; print('torch stack OK')"
          python -c "from importlib.resources import files; r = files('focus.gui'); assert all((r / p / 'index.html').is_file() for p in ('main', 'alignment'))"
          focus --help
