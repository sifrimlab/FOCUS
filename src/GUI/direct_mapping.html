<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Alignment Tool</title>
    <!-- 1. Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Vue.js 3 -->
    <script src="https://unpkg.com/vue@3"></script>
    <style>
        /* Custom styles */
        body, html, #app {
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        #image-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: auto; 
            background-color: #1a202c; 
        }

        #reference-image {
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            display: block;
        }

        #overlay-canvas {
            cursor: grab;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        #overlay-canvas:active {
            cursor: grabbing;
        }

        /* Simple CSS loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Common Dial Styling */
        .control-dial {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #374151; /* gray-700 */
            border: 2px solid #6b7280; /* gray-500 */
            cursor: pointer;
            position: relative;
            transition: background-color 0.15s;
        }
        .control-dial:hover {
            background-color: #4b5563; /* gray-600 */
        }
        .control-dial:active {
            cursor: grabbing;
        }
        .dial-indicator {
            position: absolute;
            width: 4px;
            height: 16px;
            top: 2px;
            left: 50%;
            transform-origin: 50% 22px; 
            margin-left: -2px;
        }
        .dial-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #d1d5db; /* gray-300 */
            /* Ensure the text is clickable */
            user-select: none;
        }
        .dial-label-value:hover {
            text-decoration: underline;
            cursor: text;
        }

        /* Specific Dial Colors */
        #rotation-dial .dial-indicator { background-color: #f59e0b; } /* Amber for Rotation */
        #zoom-dial .dial-indicator { background-color: #10b981; } /* Emerald for Zoom */
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div id="app">
        <!-- LOADING SCREEN -->
        <div v-if="loading" class="flex flex-col items-center justify-center h-full w-full bg-gray-900">
            <div class="loader"></div>
            <span class="text-xl mt-4 text-gray-300">Waiting for data...</span>
            <span v-if="pollingMessage" class="text-sm mt-2 text-gray-500">{{ pollingMessage }}</span>
        </div>

        <!-- MAIN APPLICATION -->
        <div v-else class="relative h-full w-full">
            
            <!-- Floating Controls (top-left) -->
            <div class="absolute top-4 left-4 z-20 flex space-x-4 items-center">
                
                <!-- Reset Button -->
                <button @click="resetView" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors duration-150">
                    Reset View & Transforms
                </button>
                
                <!-- Flip Buttons -->
                <div class="flex space-x-2">
                    <button @click="flipHorizontal" :class="isFlippedH ? 'bg-orange-500 hover:bg-orange-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-3 py-2 text-white font-semibold rounded-lg shadow-md transition-colors duration-150">
                        Flip H
                    </button>
                    <button @click="flipVertical" :class="isFlippedV ? 'bg-orange-500 hover:bg-orange-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-3 py-2 text-white font-semibold rounded-lg shadow-md transition-colors duration-150">
                        Flip V
                    </button>
                </div>

                <!-- Rotation Dial -->
                <div id="rotation-dial" class="control-dial" @mousedown.stop="startRotate" ref="dialEl">
                    <div class="dial-indicator" :style="{ transform: 'rotate(' + rotationAngle + 'deg)' }"></div>
                    <!-- Editable Value -->
                    <div class="dial-label" @mousedown.stop> <!-- Stop mousedown propagation here to prevent drag start -->
                        <span v-if="!isEditingRotation" @click.stop="startEditRotation" class="dial-label-value">{{ rotationAngle.toFixed(1) }}°</span>
                        <input v-else 
                            id="rotation-input"
                            type="number"
                            v-model.number="rotationInput"
                            @blur="finishEditRotation"
                            @keyup.enter="finishEditRotation"
                            class="w-12 text-center text-xs bg-gray-800 border border-gray-600 rounded p-0.5 text-white"
                            step="0.1"
                            />
                    </div>
                </div>

                <!-- Zoom Dial -->
                <div id="zoom-dial" class="control-dial" @mousedown.stop="startZoom" ref="zoomDialEl">
                    <div class="dial-indicator"></div> 
                    <!-- Editable Value -->
                    <div class="dial-label" @mousedown.stop> <!-- Stop mousedown propagation here to prevent drag start -->
                        <span v-if="!isEditingZoom" @click.stop="startEditZoom" class="dial-label-value">{{ canvasTransform.zoom.toFixed(2) }}x</span>
                        <input v-else 
                            id="zoom-input"
                            type="number"
                            v-model.number="zoomInput"
                            @blur="finishEditZoom"
                            @keyup.enter="finishEditZoom"
                            class="w-12 text-center text-xs bg-gray-800 border border-gray-600 rounded p-0.5 text-white"
                            step="0.01"
                            />
                    </div>
                </div>

                <!-- Confirm Button -->
                <button @click="confirm" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md transition-colors duration-150">
                    Confirm
                </button>
            </div>

            <!-- Error Message Display -->
            <div v-if="errorMessage" class="absolute top-20 left-4 z-20 p-3 bg-red-600 text-white rounded-lg shadow-lg">
                <strong>Error:</strong> {{ errorMessage }}
            </div>

            <!-- Image Frame (Handles scrolling) -->
            <div id="image-frame">
                <!-- Image/Canvas Container -->
                <div class="relative" :style="{ width: referenceImageSize.width + 'px', height: referenceImageSize.height + 'px' }">
                    
                    <!-- Reference Image -->
                    <img id="reference-image"
                         :src="referenceImage"
                         :width="referenceImageSize.width"
                         :height="referenceImageSize.height"
                         alt="Reference" />

                    <!-- Overlay Canvas -->
                    <canvas id="overlay-canvas"
                            ref="canvasEl"
                            :width="referenceImageSize.width"
                            :height="referenceImageSize.height"
                            @mousedown.prevent="handleMouseDown"
                            @mousemove.prevent="handleMouseMove"
                            @mouseup.prevent="handleMouseUp"
                            @mouseleave.prevent="handleMouseUp"
                            @wheel.prevent="handleWheel">
                    </canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Vue.js Application Logic -->
    <script type="module">
        const { createApp, ref, onMounted, watch, nextTick } = Vue;

        createApp({
            setup() {
                // --- Reactive State ---
                const loading = ref(true);
                const pollingMessage = ref('');
                const errorMessage = ref(null);
                
                const referenceImage = ref(null); 
                const referenceImageSize = ref({ width: 0, height: 0 });
                const targetCoordinates = ref([]); 
                const rasterSize = ref({ raster_px_x: 0, raster_px_y: 0 }); 
                
                const isFlippedH = ref(false);
                const isFlippedV = ref(false);
                const rotationAngle = ref(0); 
                
                // State for manual input
                const isEditingRotation = ref(false);
                const rotationInput = ref(0);
                const isEditingZoom = ref(false);
                const zoomInput = ref(1);
                
                const pixelCoordinates = ref([]); 
                const initialPixelCoordinates = ref([]); 
                const staticCentroid = ref({ x: 0, y: 0 });

                // Interactive Transformation state (pan and zoom)
                const canvasTransform = ref({ panX: 0, panY: 0, zoom: 1 });
                
                // Interaction helpers
                const isPanning = ref(false);
                const panStart = ref({ x: 0, y: 0 });

                // Dial helpers
                const isRotating = ref(false);
                const isZooming = ref(false);
                const zoomStart = ref({ y: 0 }); 
                
                // Refs
                const dialEl = ref(null); 
                const zoomDialEl = ref(null);
                const canvasEl = ref(null);

                // Calculated offsets
                const initialPan = ref({ x: 0, y: 0 });
                const initialScale = ref(1);

                // --- Core Methods: Data & Initialization ---

                const fetchData = async () => {
                    errorMessage.value = null;
                    pollingMessage.value = '';

                    try {
                        const [imgRes, coordsRes, rasterRes] = await Promise.all([
                            fetch('/get_reference_image'),
                            fetch('/get_target_coordinates'),
                            fetch('/get_target_raster_size')
                        ]);

                        if (imgRes.status === 404 || coordsRes.status === 404 || rasterRes.status === 404) {
                            pollingMessage.value = 'Data not ready. Retrying...';
                            setTimeout(fetchData, 3000);
                            return; 
                        }

                        if (!imgRes.ok) throw new Error(`Reference image fetch failed: ${imgRes.statusText}`);
                        if (!coordsRes.ok) throw new Error(`Coordinates fetch failed: ${coordsRes.statusText}`);
                        if (!rasterRes.ok) throw new Error(`Raster size fetch failed: ${rasterRes.statusText}`);

                        const coordsData = await coordsRes.json();
                        const rasterData = await rasterRes.json();

                        const rasterArray = rasterData.raster_size;
                        if (Array.isArray(rasterArray) && rasterArray.length === 2) {
                            rasterSize.value = {
                                raster_px_x: rasterArray[0],
                                raster_px_y: rasterArray[1]
                            };
                        } else {
                            throw new Error(`Invalid raster size format received.`);
                        }
                        
                        targetCoordinates.value = Array.isArray(coordsData) 
                            ? coordsData 
                            : (coordsData.coordinates && Array.isArray(coordsData.coordinates) ? coordsData.coordinates : []);

                        if (targetCoordinates.value.length === 0) {
                             throw new Error("No valid coordinates found in response.");
                        }

                        const blob = await imgRes.blob();
                        if (referenceImage.value) { URL.revokeObjectURL(referenceImage.value); }
                        referenceImage.value = URL.createObjectURL(blob);
                        
                        const img = new Image();
                        img.onload = () => {
                            referenceImageSize.value = { width: img.width, height: img.height };
                            processCoordinates();
                            resetTransformations(); 
                            resetInteractiveView(); 
                            loading.value = false;

                            nextTick(drawCanvas);
                        };
                        img.onerror = () => { throw new Error("Failed to load image blob."); };
                        img.src = referenceImage.value;

                    } catch (error) {
                        console.error("Fetch data error:", error);
                        errorMessage.value = `${error.message}. Retrying in 5s...`;
                        setTimeout(fetchData, 5000);
                    }
                };
                
                // --- Transformation Logic ---

                const resetTransformations = () => {
                    isFlippedH.value = false;
                    isFlippedV.value = false;
                    rotationAngle.value = 0;
                    applyTransformations();
                };

                const resetInteractiveView = () => {
                    canvasTransform.value = { 
                        panX: initialPan.value.x, 
                        panY: initialPan.value.y, 
                        zoom: 1 
                    };
                };
                
                const resetView = () => {
                    resetTransformations(); 
                    resetInteractiveView();
                };

                const applyTransformations = () => {
                    if (initialPixelCoordinates.value.length === 0) return;

                    const angleRad = (rotationAngle.value * Math.PI) / 180;
                    const centerX = staticCentroid.value.x;
                    const centerY = staticCentroid.value.y;

                    const transformed = initialPixelCoordinates.value.map(p => {
                        let { x, y } = p;

                        // 1. Translate to origin (Centroid)
                        let tx = x - centerX;
                        let ty = y - centerY;

                        // 2. Apply Flips
                        if (isFlippedH.value) tx = -tx;
                        if (isFlippedV.value) ty = -ty;

                        // 3. Apply Rotation (around the origin)
                        if (angleRad !== 0) {
                            const cosA = Math.cos(angleRad);
                            const sinA = Math.sin(angleRad);
                            const rx = tx * cosA - ty * sinA;
                            const ry = tx * sinA + ty * cosA;
                            tx = rx;
                            ty = ry;
                        }

                        // 4. Translate back
                        x = tx + centerX;
                        y = ty + centerY;

                        return { x: Math.round(x), y: Math.round(y), id: p.id };
                    });
                    
                    pixelCoordinates.value = transformed;
                };

                const flipHorizontal = () => {
                    isFlippedH.value = !isFlippedH.value;
                    applyTransformations();
                };

                const flipVertical = () => {
                    isFlippedV.value = !isFlippedV.value;
                    applyTransformations();
                };

                /** Converts API coords to scaled, centered pixel coords (initialPixelCoordinates) */
                const processCoordinates = () => {
                    const { height: imgHeight, width: imgWidth } = referenceImageSize.value;
                    
                    const rawPixels = targetCoordinates.value.map((coord, i) => ({
                        x: Math.round(coord.x),
                        y: Math.round(imgHeight - coord.y), // Flip the Y-axis
                        id: i
                    }));
                    
                    if (rawPixels.length === 0) {
                         pixelCoordinates.value = [];
                         initialPixelCoordinates.value = [];
                         return;
                    }
                    
                    let minX = rawPixels[0].x, maxX = rawPixels[0].x;
                    let minY = rawPixels[0].y, maxY = rawPixels[0].y;
                    let sumX = 0, sumY = 0;

                    for (const p of rawPixels) {
                        minX = Math.min(minX, p.x);
                        maxX = Math.max(maxX, p.x);
                        minY = Math.min(minY, p.y);
                        maxY = Math.max(maxY, p.y);
                        sumX += p.x;
                        sumY += p.y;
                    }

                    const centroidX = sumX / rawPixels.length;
                    const centroidY = sumY / rawPixels.length;
                    const currentWidth = (maxX - minX) || 1; 
                    const currentHeight = (maxY - minY) || 1;
                    const imageArea = imgWidth * imgHeight;
                    const targetArea = imageArea * 0.25; 
                    const currentArea = currentWidth * currentHeight;
                    
                    let scale = 1;
                    if (currentArea > targetArea) {
                        scale = Math.sqrt(targetArea / currentArea);
                    }
                    initialScale.value = scale;

                    const scaledPixels = rawPixels.map(p => ({
                        x: Math.round(centroidX + (p.x - centroidX) * scale),
                        y: Math.round(centroidY + (p.y - centroidY) * scale),
                        id: p.id
                    }));

                    const scaledSumX = scaledPixels.reduce((acc, p) => acc + p.x, 0);
                    const scaledSumY = scaledPixels.reduce((acc, p) => acc + p.y, 0);
                    const scaledCentroidX = scaledSumX / scaledPixels.length;
                    const scaledCentroidY = scaledSumY / scaledPixels.length;
                    
                    staticCentroid.value = { x: scaledCentroidX, y: scaledCentroidY };

                    const imageCenterX = imgWidth / 2;
                    const imageCenterY = imgHeight / 2;
                    
                    const deltaX = imageCenterX - scaledCentroidX;
                    const deltaY = imageCenterY - scaledCentroidY;
                    
                    initialPixelCoordinates.value = JSON.parse(JSON.stringify(scaledPixels));
                    initialPan.value = { x: deltaX, y: deltaY };
                };

                // --- Canvas Drawing ---

                const drawCanvas = () => {
                    if (!canvasEl.value || !referenceImageSize.value.width || !rasterSize.value.raster_px_x) {
                        return;
                    }

                    const ctx = canvasEl.value.getContext('2d');
                    const { width, height } = referenceImageSize.value;
                    const { panX, panY, zoom } = canvasTransform.value;
                    
                    ctx.clearRect(0, 0, width, height);
                    ctx.save();
                    
                    // Apply interactive pan and zoom
                    ctx.translate(panX, panY);
                    ctx.scale(zoom, zoom);
                    
                    const rectWidth = rasterSize.value.raster_px_x * initialScale.value;
                    const rectHeight = rasterSize.value.raster_px_y * initialScale.value;
                    const lineWidth = 1 / zoom; 

                    // Raster Alpha reduced to 0.5 as requested
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)'; 
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
                    ctx.lineWidth = lineWidth;
                    
                    for (const point of pixelCoordinates.value) {
                        const drawX = point.x - (rectWidth / 2);
                        const drawY = point.y - (rectHeight / 2);
                        
                        ctx.fillRect(drawX, drawY, rectWidth, rectHeight);
                        ctx.strokeRect(drawX, drawY, rectWidth, rectHeight);
                    }
                    
                    ctx.restore();
                };

                // --- Event Handlers: Pan/Zoom/Wheel ---

                const handleMouseDown = (e) => {
                    isPanning.value = true;
                    panStart.value = { x: e.clientX, y: e.clientY };
                };

                const handleMouseMove = (e) => {
                    if (!isPanning.value) return;
                    
                    const deltaX = e.clientX - panStart.value.x;
                    const deltaY = e.clientY - panStart.value.y;
                    
                    canvasTransform.value.panX += deltaX;
                    canvasTransform.value.panY += deltaY;
                    
                    panStart.value = { x: e.clientX, y: e.clientY };
                };

                const handleMouseUp = () => {
                    isPanning.value = false;
                };

                const handleWheel = (e) => {
                    const rect = canvasEl.value.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const zoomFactor = 1.1;
                    const oldZoom = canvasTransform.value.zoom;
                    const newZoom = e.deltaY < 0 ? oldZoom * zoomFactor : oldZoom / zoomFactor;
                    
                    // Zoom to cursor logic
                    canvasTransform.value.panX = mouseX - (mouseX - canvasTransform.value.panX) * (newZoom / oldZoom);
                    canvasTransform.value.panY = mouseY - (mouseY - canvasTransform.value.panY) * (newZoom / oldZoom);
                    canvasTransform.value.zoom = newZoom;
                };

                // --- Rotation Dial Logic ---

                const startRotate = (e) => {
                    // Prevent rotation drag if actively editing the input
                    if (isEditingRotation.value) return; 
                    e.preventDefault(); 
                    isRotating.value = true;
                };

                const onRotate = (e) => {
                    if (!isRotating.value || !dialEl.value) return;
                    e.preventDefault(); 

                    const rect = dialEl.value.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const angleRad = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                    let angleDeg = angleRad * (180 / Math.PI) + 90; 
                    
                    if (angleDeg < 0) angleDeg += 360;
                    if (angleDeg > 360) angleDeg %= 360;

                    rotationAngle.value = angleDeg;
                    applyTransformations();
                };

                const endRotate = () => {
                    isRotating.value = false;
                };
                
                // --- Rotation Edit Logic (NEW) ---
                const startEditRotation = () => {
                    rotationInput.value = parseFloat(rotationAngle.value.toFixed(1));
                    isEditingRotation.value = true;
                    nextTick(() => { 
                        const inputEl = document.getElementById('rotation-input');
                        if (inputEl) inputEl.focus(); 
                    });
                };

                const finishEditRotation = () => {
                    isEditingRotation.value = false;
                    let newAngle = parseFloat(rotationInput.value);
                    if (!isNaN(newAngle)) {
                        // Normalize rotation to 0-360 range
                        newAngle = newAngle % 360;
                        if (newAngle < 0) newAngle += 360;
                        rotationAngle.value = newAngle;
                        applyTransformations();
                    }
                };

                // --- Zoom Dial Logic ---

                const startZoom = (e) => {
                    // Prevent zoom drag if actively editing the input
                    if (isEditingZoom.value) return; 
                    e.preventDefault();
                    isZooming.value = true;
                    zoomStart.value = { y: e.clientY };
                };

                const onZoom = (e) => {
                    if (!isZooming.value) return;
                    e.preventDefault();

                    const dragY = e.clientY - zoomStart.value.y;
                    const sensitivity = -0.005; 
                    
                    const oldZoom = canvasTransform.value.zoom;
                    let newZoom = oldZoom + (dragY * sensitivity);

                    // Soft lower boundary near zero (0.001)
                    if (newZoom < 0.001) newZoom = 0.001; 

                    // Anchor Zoom to the Center of the Image/Points
                    const anchorX = referenceImageSize.value.width / 2;
                    const anchorY = referenceImageSize.value.height / 2;
                    
                    canvasTransform.value.panX = anchorX - (anchorX - canvasTransform.value.panX) * (newZoom / oldZoom);
                    canvasTransform.value.panY = anchorY - (anchorY - canvasTransform.value.panY) * (newZoom / oldZoom);

                    canvasTransform.value.zoom = newZoom;

                    // Update start position for smooth, continuous dragging
                    zoomStart.value = { y: e.clientY };
                };

                const endZoom = () => {
                    isZooming.value = false;
                };

                // --- Zoom Edit Logic (NEW) ---
                const startEditZoom = () => {
                    zoomInput.value = parseFloat(canvasTransform.value.zoom.toFixed(2));
                    isEditingZoom.value = true;
                    nextTick(() => {
                        const inputEl = document.getElementById('zoom-input');
                        if (inputEl) inputEl.focus();
                    });
                };

                const finishEditZoom = () => {
                    isEditingZoom.value = false;
                    let newZoom = parseFloat(zoomInput.value);
                    if (!isNaN(newZoom)) {
                        if (newZoom < 0.001) newZoom = 0.001; 

                        const oldZoom = canvasTransform.value.zoom;
                        
                        // Centering logic must be reapplied for manual input as well
                        const anchorX = referenceImageSize.value.width / 2;
                        const anchorY = referenceImageSize.value.height / 2;
                        
                        canvasTransform.value.panX = anchorX - (anchorX - canvasTransform.value.panX) * (newZoom / oldZoom);
                        canvasTransform.value.panY = anchorY - (anchorY - canvasTransform.value.panY) * (newZoom / oldZoom);

                        canvasTransform.value.zoom = newZoom;
                    }
                };

                // --- Button Handlers ---

                const confirm = async () => {
                    const { panX, panY, zoom } = canvasTransform.value;
                    
                    const aligned_coordinates = pixelCoordinates.value.map(point => {
                        const newX = (point.x * zoom) + panX;
                        const newY = (point.y * zoom) + panY;
                        
                        return { x_aligned: Math.round(newX), y_aligned: Math.round(newY) };
                    });
                    
                    try {
                        const res = await fetch('/save_aligned_coordinates', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ aligned_coordinates })
                        });
                        
                        if (!res.ok) {
                            throw new Error(`Server failed to save: ${res.statusText}`);
                        }
                        
                        loading.value = true;
                        pollingMessage.value = 'Data saved. Polling for next task...';
                        referenceImage.value = null; 
                        pixelCoordinates.value = [];
                        initialPixelCoordinates.value = [];
                        
                        fetchData(); 

                    } catch (error) {
                        console.error("Confirm error:", error);
                        errorMessage.value = `Error saving: ${error.message}`;
                    }
                };

                // --- Lifecycle Hooks and Watchers ---
                
                onMounted(() => {
                    fetchData();
                    document.addEventListener('mousemove', (e) => {
                        onRotate(e);
                        onZoom(e); 
                    });
                    document.addEventListener('mouseup', () => {
                        endRotate();
                        endZoom(); 
                    });
                });

                watch(
                    [canvasTransform, pixelCoordinates, rasterSize, referenceImageSize], 
                    drawCanvas, 
                    { deep: true } 
                );

                return {
                    loading,
                    pollingMessage,
                    errorMessage,
                    referenceImage,
                    referenceImageSize,
                    canvasEl,
                    isFlippedH,
                    isFlippedV,
                    rotationAngle,
                    isEditingRotation, // New
                    rotationInput,     // New
                    isEditingZoom,     // New
                    zoomInput,         // New
                    dialEl,
                    zoomDialEl,
                    canvasTransform, 
                    handleMouseDown,
                    handleMouseMove,
                    handleMouseUp,
                    handleWheel,
                    startRotate,
                    startZoom,
                    startEditRotation, // New
                    finishEditRotation, // New
                    startEditZoom,     // New
                    finishEditZoom,     // New
                    resetView,
                    flipHorizontal,
                    flipVertical,
                    confirm
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
