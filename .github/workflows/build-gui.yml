name: Build GUI

# Rebuilds the Vue/Vite front-ends from gui_src/ and opens a pull request with
# the compiled output (src/focus/GUI/{main,alignment}), so the GUI never has to
# be built and committed by hand on a dev machine. Using a PR (instead of a
# direct push) works cleanly with a protected main branch: a maintainer reviews
# and merges.
#
# Uses only first-party tooling: actions/checkout, actions/setup-node, and the
# pre-installed GitHub CLI (`gh`) authenticated with the built-in GITHUB_TOKEN.
# No third-party/marketplace actions.
#
# Both Vite configs write their build straight into src/focus/GUI/<app>/
# (see gui_src/<app>/vite.config.ts → build.outDir), so no copy step is needed.

on:
  push:
    branches: [main]
    paths:
      - 'gui_src/**'
  workflow_dispatch:

# contents: write  → push the rebuilt-GUI branch
# pull-requests: write → open/update the PR
permissions:
  contents: write
  pull-requests: write

# Don't pile up GUI builds; a newer push supersedes an in-flight one.
concurrency:
  group: build-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            gui_src/main/package-lock.json
            gui_src/alignment/package-lock.json

      # Clear stale compiled assets first. Vite's outDir lives outside the
      # project root, so Vite does not empty it automatically. Wiping here
      # keeps the output free of orphaned, content-hashed chunks. `git rm`
      # stages the deletions; the build then recreates the dirs.
      - name: Clear previous build output
        run: |
          git rm -r --quiet --ignore-unmatch src/focus/GUI/main src/focus/GUI/alignment || true

      - name: Build main GUI
        working-directory: gui_src/main
        run: |
          npm ci
          npm run build

      - name: Build alignment GUI
        working-directory: gui_src/alignment
        run: |
          npm ci
          npm run build

      # Open (or update) a PR only when the compiled output actually changed.
      # The PR targets main from a dedicated branch, so it never pushes to a
      # protected main directly. Force-pushing the fixed branch updates an
      # already-open PR in place.
      - name: Open PR with rebuilt GUI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- src/focus/GUI)" ]; then
            echo "No GUI changes, nothing to open a PR for."
            exit 0
          fi

          BRANCH="ci/rebuild-gui"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add -A src/focus/GUI
          git commit -m "ci: rebuild GUI from gui_src"
          git push --force-with-lease origin "$BRANCH"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "PR for $BRANCH already open. It now points at the new commit."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "ci: rebuild GUI from gui_src" \
              --body "Automated rebuild of the Vue/Vite front-ends from \`gui_src/\`. Merging updates the served GUI under \`src/focus/GUI/\`. Generated by the **Build GUI** workflow."
          fi